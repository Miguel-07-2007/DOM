<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>
<style>
    .rounded-circle {
        border: 3px solid black;
    }
</style>

<body>
    <main>
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            Semaforo
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">

                                <div id="luz_verde" class="circulo rounded-circle m-2" style="width: 50px; height: 50px; background-color: black;"></div>

                                <div id="luz_amarilla" class="circulo rounded-circle m-2" style="width: 50px; height: 50px; background-color: black;"></div>

                                <div id="luz_roja" class="circulo rounded-circle m-2" style="width: 50px; height: 50px; background-color: black;"></div>

                            </h5>
                            <p class="card-text" id="msg">Seleccione un botón para probar el semáforo</p>
                            <div class="d-flex gap-3">
                                <button id="verde" class="btn btn-success">Verde</button>
                                <button id="amarillo" class="btn btn-warning">Amarillo</button>
                                <button id="rojo" class="btn btn-danger">Rojo</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
