<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="card" style="width: 18rem;" id="carta">
  <div class="card-body">
    <header>
        <h3>Carta</h3>
    </header>
    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
  </div>
</div>
<select class="form-select" aria-label="Default select example">
  <option selected>Open this select menu</option>
  <option value="blue">Blue</option>
  <option value="red">Red</option>
  <option value="green">Green</option>
</select>

<script>
    const carta = document.getElementById("carta")
    const select = document.querySelector(".form-select")
    select.addEventListener("change", function(){
        let color = select.value
        if (color == "blue"){
            carta.style.backgroundColor = "blue";
        }
        else if (color == "red"){
            carta.style.backgroundColor = "red";
        }
        else if (color == "green"){
            carta.style.backgroundColor = "green";
        }
        
    })
</script>
</body>
</html>
