<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>

<body>
    <form action="#">
        <div class="mb-3">
            <label for="peso_kg" class="form-label">Peso en kg</label>
            <input type="number" class="form-control" id="peso_kg" placeholder="Peso" min="30" max="150" required>
        </div>
        <div class="mb-3">
            <label for="estatura_mt" class="form-label">Estatura en M</label>
            <input type="number" class="form-control" id="estatura_mt" placeholder="Estatura" step="0.01" min="1.00"
                max="3.00" required>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Submit form</button>
        </div>
    </form>

    <div class="mb-3">
        <h3>Resultado:</h3>
    </div>
    <div class="col-12 mb-3">
        <p id="resultado">-----</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
